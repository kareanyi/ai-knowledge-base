name: Daily Collect

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: v2

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: v2/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collection
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python pipeline/pipeline.py --sources github,rss --limit 20 --verbose

      - name: Validate articles
        run: |
          if ls knowledge/articles/*.json 1>/dev/null 2>&1; then
            python hooks/validate_json.py knowledge/articles/*.json || echo "⚠️ 部分文件校验失败，继续执行"
            python hooks/check_quality.py knowledge/articles/*.json || echo "⚠️ 部分文件质量不达标，继续执行"
          else
            echo "No articles to validate"
          fi

      - name: Commit and push
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add v2/knowledge/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            COUNT=$(git diff --staged --name-only | grep -c '\.json$' || true)
            DATE=$(date -u +%Y-%m-%d)
            git add -A
            git commit -m "[workflow]docs: collect $COUNT articles on $DATE"
            git push
          fi